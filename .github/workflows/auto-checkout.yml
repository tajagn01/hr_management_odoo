name: Auto-Checkout

on:
  schedule:
    # Runs at 5:15 PM IST (11:45 AM UTC) Monday-Saturday
    - cron: '45 11 * * 1-6'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-checkout:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Auto-Checkout
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            ${{ secrets.APP_URL }}/api/cron/auto-checkout
