name: Auto-Mark Attendance

on:
  schedule:
    # Runs at 5:00 PM IST (11:30 AM UTC) Monday-Saturday
    - cron: '30 11 * * 1-6'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-mark:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Auto-Mark Attendance
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            ${{ secrets.APP_URL }}/api/cron/auto-mark-attendance
